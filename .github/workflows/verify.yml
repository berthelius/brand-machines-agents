name: Verify agent edition
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guardian:
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python skills/brand-machines/scripts/bm.py validate
      - run: python skills/brand-machines/scripts/bm.py diagnose
